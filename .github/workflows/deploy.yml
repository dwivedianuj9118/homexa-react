name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Copy images from homexarealty.com so the site serves its own copies.
      # If any download fails, the build keeps loading images from the live site.
      - name: Self-host images
        run: |
          if npm run fetch-images; then
            echo "VITE_IMAGE_BASE=${BASE_PATH}images" >> "$GITHUB_ENV"
          fi
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Serve from https://<user>.github.io/<repo>/. Remove BASE_PATH when using a custom domain.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
